<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soneto</title>
    <link rel="stylesheet" href="poem-styles.css">
</head>

<body>

    <!-- Hero Container: Contiene la imagen de fondo con fade y el poema encima -->
    <section class="poema-hero">

        <!-- Imagen con desvanecido inferior -->
        <div class="imagen-wrapper">
            <img src="lirio.webp" alt="Fondo poético" class="imagen-fade">
        </div>

        <!-- Contenido superpuesto -->
        <div class="poema-contenido">
            <h1 class="poema-titulo">Lirio de Fuego.</h1>
            <p class="poema-autor">de Bernabeth, para Sasha</p>

            <div class="poema-versos">
                <p>
                    El lirio blanco, puro y excepcional:<br>
                    Para mí, amor, tú eres esa pureza.<br>
                    Pétalos claros y redondos, sin mal.<br>
                    Tallo fuerte, lejos de la maleza.
                </p>
                <p>
                    -<br>
                    -<br>
                    -<br>
                    -
                </p>
                <p>
                    -<br>
                    -<br>
                    -
                </p>
                <p>
                    -<br>
                    -<br>
                    -
                </p>
            </div>

            <!-- Botón para volver al cuento -->
            <a href="index.html" class="boton-volver">← Volver al cuento</a>
        </div>

    </section>

</body>

</html>
