<body>
    <div class="capitulo-poema">
        <h1>Lirio de Fuego.</h1>

        <!-- Clase especial para que respete los saltos de línea del poema -->
        <div class="poema">
            <p>
                Un verso aquí que empieza la penumbra,<br>
                otro verso que sigue en la distancia,<br>
                la luz lejana que apenas alumbra,<br>
                y el susurro tenue de su fragancia.
            </p>

            <p>
                (Siguiente estrofa aquí...)
            </p>
        </div>

        <!-- Botón para volver al cuento -->
        <a href="index.html" class="boton-enlace">← Volver al cuento</a>
    </div>
